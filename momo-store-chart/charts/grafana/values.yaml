name: grafana
grafana:
  host: grafana.koolthing.click
  port: 80
service:
  ports:
    port: 80
    targetPort: 3000
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:80
          isDefault: true
          jsonData:
            timeInterval: "5s"
  sidecar:
    dashboards:
      enabled: true
  dashboardsConfigMaps:
    custom-dashboards: momo-dashboard