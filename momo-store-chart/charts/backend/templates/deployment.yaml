---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    app.kubernetes.io/name: {{ .Values.global.appname }}-{{ .Chart.Name }}
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/component: {{ .Chart.Name }}
    app.kubernetes.io/part-of: {{ .Values.global.appname }}
    env: "{{ .Values.global.environment }}" 
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: "{{ .Values.strategy.type }}"
    {{ if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
    {{ end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8081"
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.global.image.registry }}/{{ .Values.global.image.repository }}/{{ .Chart.Name }}:{{ .Values.image.tag }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
{{/*         env:
           - name: VAULT_ADDR
             value: "{{ .Values.env.vaultAddr }}"
           - name: VAULT_TOKEN
             valueFrom:
               secretKeyRef:
                 name: vault
                 key: vault_token */}}
          ports:
            - name: "{{ .Chart.Name }}"
              containerPort: {{ .Values.service.ports.port }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.ports.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 90
            timeoutSeconds: 5
            failureThreshold: 6
          envFrom:
          - configMapRef:
              name: {{ .Chart.Name }}-config
      imagePullSecrets:
        - name: {{ .Chart.Name }}-secrets