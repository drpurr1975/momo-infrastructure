---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .Chart.Name }}-vpa
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: {{ .Chart.Name }}
  updatePolicy:
    updateMode: "{{ .Values.updatePolicy.updateMode }}"
  resourcePolicy:
    containerPolicies:
      - containerName: "{{ .Values.containerPolicies.containerName }}"
        minAllowed:
          cpu: {{ .Values.containerPolicies.minAllowed.cpu }}
          memory: {{ .Values.containerPolicies.minAllowed.memory }}
        maxAllowed:
          cpu: {{ .Values.containerPolicies.maxAllowed.cpu }}
          memory: {{ .Values.containerPolicies.maxAllowed.memory }}
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsAndLimits 