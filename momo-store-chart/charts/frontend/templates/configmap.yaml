---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    events {
    }
    http {
      server {

        listen 8080;

        location / {
          root   /usr/share/nginx/html;
          index  index.html;
          try_files $uri $uri/ /index.html;
        }

        location /api {
            proxy_pass http://sausage-backend-service:8080;
        }
      }
    }
  LOG_PATH: /app
  REPORT_PATH: /app