---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  selector:
    app: {{ .Chart.Name }}
  type: ClusterIP
  ports:
    - port: {{ .Values.service.ports.port }}
      protocol: TCP
      targetPort: {{ .Values.service.ports.targetPort }}
