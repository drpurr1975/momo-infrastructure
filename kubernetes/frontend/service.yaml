---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: default
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-loadbalancer
  # annotations:
  #   service.beta.kubernetes.io/yandex-load-balancer-type: "external"
  namespace: default
spec:
  type: LoadBalancer
  loadBalancerIP: 130.193.59.166
  ports:
    - port: 80
      name: plaintext
      targetPort: 8080
  # - name: https
  #   port: 443
  #   targetPort: 443
  selector:
    app: frontend
#    app.kubernetes.io/name: ingress-nginx
