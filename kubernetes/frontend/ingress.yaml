---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: default
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - "kurenkov-mikhail-033.k8s.praktikum-services.tech"
  rules:
    - host: "kurenkov-mikhail-033.k8s.praktikum-services.tech"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port:
                number: 80